# Multi-Agent NN Parameter Optimization Configuration
# ===================================================
#
# CALIBRATION REFERENCE -- read this before changing any val_bpb threshold.
# =========================================================================
# Re-derived 2026-08-05 against state/noise_floor.json and the 582 finite runs
# in archive/campaign-20260804-timebudget/results.tsv.
#
# 2026-08-11: EVERY NUMBER BELOW WAS MEASURED AT TOKEN_BUDGET = 12.5M TOKENS.
# The budget is now 4.19M (see prepare.py), and noise is a property of how much
# training a run gets -- less training leaves a run further from convergence and
# so more dependent on its initial weights. Re-measured at the new budget,
# 15 runs, 3 configs x 5 seeds, state/seed_variance.json:
#
#   sigma_seed = 0.003215   campaign-wide, up 1.63x from 0.00197
#   _load_sigma returns 0.003729 (the MEDIAN per-config spread, which is what
#   the freeze bar and stagnation test are sized against) -- up 2.8x from the
#   0.001342 a_within they were using, because that came from
#   region_geometry.json, a 12.5M measurement.
#
#   Freeze bar (2*sigma):  0.002684 -> 0.007458.
#
#   sigma_paired_diff = 0.004655 against an independent reference of 0.004547,
#   so 0% of the seed effect is now SHARED across configurations (it was 4%).
#   Nothing cancels in a comparison.
#
#   PER-CONFIG SPREAD VARIES 5x: 0.003729 / 0.004073 / 0.000724, and the quiet
#   one is the SMALLEST model. At 187 optimizer steps the large models are the
#   undertrained ones. No single global threshold describes this space well;
#   the median is a compromise, not a fact.
#
#   The frontier pair FLIPPED 3-2 at a gap of 0.003563, which would need 32
#   seeds each to resolve. Treat the top of the ladder as a plateau.
#
# 2026-08-12: THE GEOMETRY IS RE-MEASURED TOO (42 runs, 4.19M,
# reports/region_geometry.md), so the saturation rule is live again:
#
#   A-within = 0.002070 (12.5M: 0.001342). This is what _load_sigma and
#   measured_a_within now return -- it is the WITHIN-REGION quantity, measured
#   with the architecture frozen, and so smaller than seed_variance's 0.003729,
#   which spans three different architectures.
#
#   Freeze bar (2 * A-within): 0.002684 -> 0.004139.
#
#   region_radius 0.05 -> 0.02, merge_radius 0.025 -> 0.01. B(r) is ~8x larger
#   at every radius than at 12.5M: at 0.02 the real signal is 5.0x A-within,
#   where at 12.5M it was 0.07x, i.e. saturated on arrival. See the setting
#   itself for the table.
#
#   A-between is NOT anchor-dominated this time (anchor std 0.000851 against
#   0.000895 / 0.002022), so the depth-vs-width comparison is finally readable:
#   +1 layer moves val_bpb by +0.000973 at separation 1.0 -- unmeasurable --
#   while narrowing n_embd 960 -> 768 costs +0.015052 at separation 22.3.
#   Depth is free to vary at this scale; width is not.
#
# Any number below that is not named in this block or the one above is still a
# 12.5M figure and should be treated as stale until re-measured.
#
# 2026-08-07: scripts/seed_variance.py (15 runs, 3 configs x 5 seeds) measured
# the scale that was MISSING from everything below, and it changes which
# yardstick is correct. Read this part first.
# (SUPERSEDED by the block above, kept because the reasoning still applies.)
#
#   sigma_seed   = 0.00197    MEDIAN of the per-config seed spreads
#                  (measured 0.00154 / 0.00197 / 0.00887 -- a ~6x range that
#                  tracks step count, so no single number is right everywhere;
#                  the median is robust and sits near the frontier, where the
#                  decisions are). state/seed_variance.json.
#
#                  THIS IS NOW WHAT agents/search_planner.py::_load_sigma
#                  RETURNS. It prefers state/seed_variance.json and only falls
#                  back to noise_floor.json (loudly) when that is absent, so
#                  prune_by_noise_floor and _detect_stagnation are both sized
#                  against it automatically -- no value below needs editing
#                  for that to take effect.
#
#   Consequence: the freeze bar (2*sigma) went 0.00159 -> 0.00394, i.e. 2.5x
#   higher. Parameters whose total effect is under ~0.004 are no longer judged
#   measurable, because they are not: a single run's score moves more than that
#   from the initial weights alone.
#
#   Also measured: the two best configs of the whole campaign trade places
#   depending on the seed (3-2 across 5 seeds, mean gap 0.0012 +- 0.0030,
#   separation 0.9). Resolving them would take ~25 seeds each. Treat the
#   frontier as a PLATEAU, not a ranking, and require a candidate to win by
#   >= 0.0035 on 3 seeds (or >= 0.0060 on one) before believing it.
#
#   sigma        = 0.000797   (0.061% of a typical val_bpb = 1.3027)
#                  SUPERSEDED as a decision yardstick -- kept for reference and
#                  as the fallback when no seed measurement exists. It was
#                  taken with the seed, the data and the token budget ALL held
#                  fixed, so it measures bf16/kernel nondeterminism and no
#                  statistical variation at all. Using it to ask "is this
#                  difference real" understates the noise ~2.5x at the frontier.
#                  state/noise_floor.json, n=10, round-robined across GPUs.
#
#   sigma_region = 0.0028     (3.5 x sigma)
#                  Spread of val_bpb among DIFFERENT configs inside one
#                  region (region_radius = 0.05 in normalized 11-D). Use for:
#                  "is this probe bad", "is region A better than region B",
#                  anything comparing two different configurations.
#
# Why two: the token budget collapsed sigma ~11x (every run now gets identical
# tokens regardless of GPU speed, so the "slow GPU fits fewer steps" confound
# is gone -- it was worth std 0.00919 under the old time budget). But
# within-region spread is real hyperparameter variation, not measurement
# noise, and it did NOT collapse. A region-level threshold sized in sigma is
# ~4x too sensitive; one sized in sigma_region and quoted as sigma looks
# absurdly loose. Both mistakes are in this file's history.
#
# sigma_region is measured, not assumed: within-region std at radius 0.04-0.05
# is 0.0028 after regressing out log(num_steps) (which controls the time-budget
# artifact in the archived data), rising sharply to 0.0131 at radius 0.08 and
# 0.0251 at 0.10. That jump is a real structure boundary -- below ~0.05 a
# region is one basin, above it you are averaging several. Re-derive once a
# token-budget campaign has a few hundred runs of its own.
#
# TWO RULES IN THIS FILE ARE STRUCTURALLY BROKEN, not merely mis-tuned.
# Measured against real history, no value of either discriminates:
#
#   bad_tolerance (probe vs the CAMPAIGN-wide elite) -- SINCE REMOVED.
#   Sweeping it 17x, from 0.05 to 0.003, moved "fraction of runs called bad"
#   only from 55% to 85%: it measured "is this run not elite" (true for most
#   runs by construction), not "is this region bad". Worse, Agent 4 fell back
#   to the campaign-wide reference whenever a neighbourhood had < 4 historical
#   runs, which on a fresh campaign is always. Retirement is now RELATIVE
#   between live regions (retire_margin_sigma), and the setting was deleted
#   rather than demoted, since nothing read it.
#
#   stagnation_min_improvement: reads "stagnant" at 89-92% of iterations for
#   every threshold from 0.001 to 0.005. The frontier genuinely does not move
#   in most 10-run windows, so gating exploration on it is a weak trigger at
#   any setting. This is why exploration is continuously scheduled by the
#   allocator rather than triggered reactively by this signal.

# AGENT 1: Training Specialist
agent1:
  # Whether to use Claude for hyperparameter suggestions (via the Claude
  # Code CLI -- your subscription, not a separately-billed API key, see the
  # llm: section below). Shares one campaign-wide budget with agent2/agent3.
  # Only actually calls Claude on the iteration right after Agent 3 creates
  # a fresh summary (agents/orchestrator.py tracks this) -- not every
  # iteration -- so it reads one complete, batch-informed summary per call
  # instead of firing on every single run.
  use_llm: true

  # Stop when accuracy reaches this threshold (val_bpb lower is better)
  accuracy_threshold: 0.97

  # Stop when total API cost exceeds this amount (USD)
  cost_limit_usd: 50.0

  # --- stall / stagnation, both calibrated: see the CALIBRATION REFERENCE ---
  # How much better than the best of the preceding max_stalled_iterations runs
  # the latest run must be, in ABSOLUTE val_bpb, for the search not to count
  # as stalled. This compares different configurations, so the yardstick is
  # sigma_region (0.0028): 0.005 = 1.8 sigma_region, a real but reachable
  # demand. In sigma it would read as 6.3, which is what made it look
  # mis-set -- it is not, it is just measured on the other scale.
  min_improvement: 0.005
  max_stalled_iterations: 3

  # _detect_stagnation's margin, as a multiple of sigma (0.000797). This
  # replaced a hardcoded 0.01, which is 12.6 sigma today -- so a genuine
  # 6-sigma gain was recorded as "no progress" and routed the search into
  # _radical_change. Sigma has already moved ~11x once (time budget -> token
  # budget); a multiple keeps meaning the same thing when it moves again.
  stagnation_sigma_multiple: 2.0

  # Training time budget per model (seconds)
  # SSH-timeout base ONLY -- it does NOT set training length. The budget is
  # prepare.py's TOKEN_BUDGET (12.5M tokens); train.py stops on tokens, not
  # seconds. Wall-clock therefore varies with throughput and server load:
  # median ~5 min, p90 ~10 min, ~19 min at the slowest throughput observed,
  # with a hard 1800s safety cap in train.py. This is set above that cap plus
  # eval/ablation overhead (~230s measured) so the SSH channel never gives up
  # on a run that is still legitimately working.
  training_budget_seconds: 2000

  # Safe operating ranges for each of train.py's 4 LR groups (see
  # GPT.setup_optimizer in train.py). Values are clamped to these ranges
  # before being written to model_hyperparams.yaml; train.py also clamps
  # independently as a defensive boundary check.
  embedding_lr_min: 0.05
  embedding_lr_max: 3.0
  unembedding_lr_min: 0.0005
  unembedding_lr_max: 0.02
  matrix_lr_min: 0.005
  matrix_lr_max: 0.2
  scalar_lr_min: 0.05
  scalar_lr_max: 2.0

  # Tier 1 surrogate (Random Forest + Expected Improvement, see
  # state/surrogate.py and agents/search_planner.py). Degrades automatically
  # to the evidence/heuristic path below when scipy/scikit-learn aren't
  # installed or there isn't enough data yet -- these keys don't need to be
  # touched for that fallback to work.
  use_surrogate: true
  surrogate_min_observations: 15   # Sobol cold-start size before the RF fits
  surrogate_cycle_runs: 10         # runs per block-rotation cycle
  # Two params are tuned jointly when their interaction score is at least
  # this fraction of the strongest observed interaction (union-find, see
  # state/surrogate.py::blocks_from_interactions).
  #
  # Measured on 552 real runs: interaction strength is 0.0706 for
  # n_layer x batch_size, 0.0534 for n_embd x batch_size, then drops ~2x to
  # 0.0265 for everything else. Both strong pairs tie model size to batch
  # size, which is exactly what a fixed wall-clock budget implies -- together
  # they set how many optimization steps a run gets (batch_size vs num_steps
  # is rho=-0.70, n_layer vs num_steps rho=-0.53).
  #
  # 0.15 sat below that long tail, so union-find chained 8 of the 11 params
  # into ONE block and EI ended up varying 8 dimensions at once -- sparse
  # coverage from 2000 candidates, and no real Gauss-Southwell benefit.
  # Anything in 0.4-0.7 yields the identical split ([n_layer, n_embd,
  # batch_size] + singletons), so this sits on a genuine structural boundary
  # rather than a knife-edge. Re-derive if the search space or the training
  # budget changes, since the size/batch coupling is budget-dependent.
  interaction_threshold: 0.4

  # Tier 2 token-level XAI (see agents/xai_methods/token_methods.py and
  # dev/INNOVATION_PLAN.md). Costs real extra GPU time (roughly doubled
  # wall-clock time in testing), so it isn't on for every run.
  #
  # token_xai_enabled is NOT set here -- Orchestrator decides it fresh each
  # iteration (agents/orchestrator.py) and writes it into that iteration's
  # hyperparams: on at a fixed interval (token_xai_interval, a floor so
  # history keeps accumulating during a losing streak) OR for the run right
  # after a new best val_bpb is found (the closest approximation to
  # "fingerprint the best model" possible today -- train.py fuses training
  # and fingerprinting into one process with no checkpoint save/reload, so
  # the actual best run can't be retroactively fingerprinted).
  token_xai_interval: 5

  # Score the held-out shard (prepare.py's HOLDOUT_SHARD, which the search
  # never trains or selects on) whenever a run sets a new best val_bpb.
  #
  # Why it matters: every accept/reject decision this campaign makes is
  # against ONE pinned validation shard, and it has now made 500+ of them --
  # a multiple-comparisons problem. With sigma=0.003187, the expected
  # inflation of "best of N" from noise alone is about sigma*sqrt(2*ln N)
  # ~= 0.011 bpb at N=564, against an elite-to-best gap of ~0.041. So a
  # meaningful slice of the apparent lead could be selection luck. The
  # holdout shard is the instrument that tells the difference, and until
  # this flag existed it was only reachable via a manual end-of-campaign
  # script (scripts/holdout_eval.py) -- so drift was never actually tracked.
  #
  # Cost is one extra eval pass, and only on a genuine new best (none in the
  # last 300+ runs), so it is effectively free. train.py makes the
  # comparison itself, in-process, because once a run ends its model is gone
  # and a record-setting config can never be re-scored afterwards.
  holdout_on_new_best: true

  # token_xai_seq_len/token_xai_n_batches ARE read by train.py directly from
  # model_hyperparams.yaml (same as ablation_k below), not from this file --
  # documented here for discoverability only.
  # token_xai_seq_len: 384      # tokens per probe slice (short, not the full training context -- VRAM discipline)
  # token_xai_n_batches: 4      # number of probe slices to average the fingerprint over

# AGENT 2: XAI Specialist
agent2:
  # Which XAI method to use: "fast" or "thorough"
  xai_method: "fast"

  # Whether to use Claude for prose report interpretation (via the Claude
  # Code CLI, see the llm: section below). Adds a short "LLM Interpretation"
  # section to every per-run report. OFF by default: this fires on EVERY
  # iteration (unlike agent3, which only fires every batch_size reports),
  # so it was the single fastest drain on the shared campaign_budget_usd.
  use_llm: false

  # Fast methods
  fast_methods:
    - ablation  # Turn off attention heads, measure impact
    - partial_dependence  # Vary hyperparams, estimate impact

  # For ablation: analyze top-K heads by weight magnitude
  ablation_k: 10

  # Only re-analyze what changed (incremental analysis)
  incremental: true

  # Auto-generate charts (hyperparameter importance, head heatmap, per-layer
  # scalars) and embed them in every report's markdown. See state/visualize.py.
  generate_charts: true

# AGENT 3: Report Analyst
agent3:
  # Summarize every N new reports (batch size). Larger batches mean fewer
  # summaries (and fewer agent3/agent1 LLM calls, since Agent 1 only reads
  # the LLM path on the iteration right after a fresh summary) at the cost
  # of less frequent hyperparameter-recommendation refreshes.
  batch_size: 7

  # Whether to use Claude for narrative summary + Tier 3 cluster hypotheses
  # (via the Claude Code CLI, see the llm: section below).
  use_llm: true

  # Include previous summary in new summary (preserve history)
  preserve_history: true

  # Auto-generate charts (val_bpb trend, importance evolution, status
  # distribution, layer importance) and embed them in every summary's
  # markdown. See state/visualize.py.
  generate_charts: true

  # Tier 3 (see state/clustering.py, dev/INNOVATION_PLAN.md): minimum number
  # of historical token-fingerprint-bearing reports before clustering runs
  # at all -- below this, the summary honestly reports "not enough data yet"
  # rather than fabricating a cluster. Silhouette-based cluster selection
  # needs enough points to be meaningful; 8 is a considered starting floor,
  # adjustable once real fingerprint history accumulates via Tier 2's
  # token_xai_interval cadence trigger (agents/orchestrator.py).
  min_cluster_observations: 8

# AGENT 4: REGION PROPOSER AND LIFECYCLE JUDGE
#
# Two jobs: decide where a newly-freed GPU should start looking, and decide
# when a running region has earned a lifecycle change. It does NOT propose
# training configurations -- that is Agent 1 scoped to a region
# (Agent1TrainingSpecialist.search_region), with the allocator
# (agents/allocator.py) deciding which region each GPU serves each wave.
#
# It used to be a temporary override of a single search: watch for stagnation,
# seize every GPU for a bounded "window", probe one region, hand control back.
# Exploration and exploitation were phases and the trigger was reactive, so on
# a short campaign the better region was found with no budget left to exploit
# it. Several regions now run at once and exploration is scheduled
# continuously instead of triggered.
agent4:
  enabled: true

  # --- how many regions stay alive -----------------------------------------
  # The allocator opens a new region when it has a spare GPU and fewer than
  # this are live, and never fragments past it.
  #
  # 4 is tied to orchestrator.max_parallel_runs: with more regions than GPUs
  # the surplus is permanently paused, which is capacity accounting dressed
  # up as a search decision.
  #
  # There is deliberately no min_regions companion. A new region can only be
  # opened when a GPU is free, so a floor would be unenforceable exactly when
  # it mattered -- and a setting that reads as live while doing nothing is
  # worse than no setting, because it gets tuned.
  max_regions: 4

  # --- lifecycle, all counted in RUNS THIS REGION SPENT --------------------
  # Not in orchestrator iterations: a region holding two GPUs accumulates
  # twice as fast as one holding a single GPU, so an iteration count would
  # judge two regions on different amounts of evidence while looking like one
  # rule.
  #
  # A region is not judged at all until it has this many measured runs -- and
  # a crashed/OOM run is not a measurement, it is an absence of one.
  min_runs_before_judgement: 5

  # No improvement in this many runs -> exploitation_paused, and the
  # allocator looks for somewhere better. Recoverable on purpose: "we have
  # not improved here lately" and "there is nothing here" are different
  # claims and only the first is supported at 5 runs. If nothing better
  # exists, Agent4.resume_best_paused brings it straight back.
  stuck_runs_pause: 5

  # No improvement in this many -> local_optimum, retired for good. This is
  # the stronger claim and it needs the longer record.
  stuck_runs_retire: 15

  # --- what counts as better / worse ---------------------------------------
  # sigma_region: spread of val_bpb among DIFFERENT configs inside one region
  # (measured: 0.0028 at region_radius 0.05, after regressing out
  # log(num_steps) to control the archived data's time-budget artifact). Every
  # threshold below compares one configuration against another, so this -- not
  # the noise floor's sigma = 0.000797 -- is the right yardstick. Using sigma
  # here would make all of them ~4x too sensitive. See the CALIBRATION
  # REFERENCE at the top of this file.
  #
  # 2026-08-07, NOT YET ACTED ON -- a decision for the operator, not a silent
  # change. sigma_seed at the frontier is 0.00197, so of this 0.0028 of
  # "within-region spread", 0.00197^2 / 0.0028^2 = ~49% is variance from the
  # initial weights, NOT differences between the configurations. The genuine
  # config-to-config spread inside a region is closer to
  # sqrt(0.0028^2 - 0.00197^2) = 0.0020.
  #
  # Lowering it to 0.0020 would tighten every Agent 4 lifecycle threshold
  # (retire_margin_sigma * sigma_region: 0.0084 -> 0.0060; improvement_sigma:
  # 0.0028 -> 0.0020), i.e. retire and pause regions sooner. That is defensible
  # -- it stops counting seed noise as real hyperparameter variation -- but it
  # makes the campaign more aggressive and was measured on 3 configs, so it is
  # left alone pending a wider measurement.
  # 2026-08-12: 0.0028 -> 0.010579, re-measured as B(r) at the fence radius
  # (scripts/region_geometry.py at TOKEN_BUDGET=4.19M, radius 0.02). The old
  # value was measured at 12.5M inside a radius-0.05 fence and is 3.8x too
  # small here -- under it a region was retired for falling 0.0084 behind the
  # field when the real bar is 0.0318, i.e. thrown away for differences well
  # inside its own normal spread.
  #
  # This is now a FALLBACK ONLY. Agent 4 reads B(r) live from
  # state/region_geometry.json at whatever the fence radius is, because this
  # number moves with both the radius and the token budget.
  sigma_region: 0.010579

  # A region is retired as no_optimum when its elite score sits this many
  # sigma_region behind the best LIVE region's. Relative, never absolute: an
  # absolute bar against a campaign-wide elite measures "is this run not
  # elite" (true for most runs by construction), not "is this region bad".
  # 3.0 sigma_region = 0.0084 bpb.
  retire_margin_sigma: 3.0

  # How much better a run must be than the region's previous best to count as
  # an improvement at all, in sigma_region. Feeds
  # Region.runs_since_improvement, whose default of 0.0 would count pure
  # noise as progress and so never register a region as stuck.
  improvement_sigma: 1.0

  # --- geometry ------------------------------------------------------------
  # How wide a "region" is, in NORMALIZED 11-D HYPERPARAMETER DISTANCE
  # (state/regions.py::distance), divided by sqrt(11) so it sits on a 0-1
  # scale. THE UNITS CHANGED: this used to be a fraction of the 2-D PCA grid
  # extent. That projection explained 0.296 of the variance on a 500-run
  # campaign, so it could not answer "are these two the same place" -- fine
  # when one candidate region was tested at a time, unusable now that the
  # question is asked constantly. The PCA is a visualization again.
  #
  # The value survives the change of units by coincidence, but it is
  # re-derived, not carried over. Within-region val_bpb spread is 0.0028 at
  # radius 0.04-0.05, 0.0131 at 0.08, 0.0251 at 0.10. That 4.7x jump between
  # 0.05 and 0.08 is a real structure boundary: below it a region is one
  # basin, above it you are averaging several together. 0.05 also leaves ~10
  # historical neighbours in a 582-run campaign.
  # 2026-08-12: TIGHTENED 0.05 -> 0.02, re-measured at TOKEN_BUDGET = 4.19M
  # (scripts/region_geometry.py, 42 runs, reports/region_geometry.md). The
  # right radius is the smallest one that still leaves something to find, and
  # that moved because the response surface did: B(r), the spread among
  # DIFFERENT configurations inside the fence, is roughly 8x larger at every
  # radius than it was at 12.5M.
  #
  #   radius   B(12.5M)   B(4.19M)   real signal / A-within (4.19M)
  #   0.02     0.001345   0.010579   5.01
  #   0.05     0.010800   0.045045   21.74
  #   0.10     0.007683   0.078920   38.12
  #
  # At 12.5M, r=0.02 was SATURATED ON ARRIVAL (0.07x A-within) and 0.05 was the
  # smallest radius with anything in it. At 4.19M, 0.02 already carries 5x the
  # noise floor. With 187 optimizer steps a bad learning rate cannot be
  # recovered from, so configurations a short distance apart now differ a great
  # deal -- and a fence that big would enclose several basins rather than one.
  region_radius: 0.02

  # Regions whose ANCHORS come within this distance are merged
  # (RegionRegistry.merge_overlapping). Each region's local search walks its
  # own center downhill and nothing stops two of them walking into the same
  # basin; left alone that silently halves the parallelism -- two GPUs, two
  # planner states, one basin. Half of region_radius, so a merge means their
  # neighbourhoods overlap across most of their mass rather than merely
  # touching at the edge.
  #
  # 2026-08-12: 0.025 -> 0.01, following region_radius down. It has to: at
  # 0.025 against a region_radius of 0.02 the merge distance would be LARGER
  # than the regions themselves, so two regions that barely touched would be
  # merged. Half of region_radius is the rule, not the number.
  merge_radius: 0.01


  # Resolution of the predicted-surface grid shared with the landscape chart.
  # Agent 4 reads grid_z_std (where nobody has looked) and grid_z_mean (where
  # a rival optimum might be) off it to anchor two of its three proposal
  # criteria.
  grid_resolution: 24

  # statistics | hybrid | llm
  #   statistics -- fully deterministic, zero LLM cost.
  #   hybrid     -- decisions stay deterministic; the LLM only writes the
  #                 prose record of each lifecycle decision.
  #   llm        -- reserved; currently behaves as hybrid.
  #
  # The LLM is deliberately off the decision path here. Measured on the
  # archived campaign, LLM-decided runs beat their local 10-run median 89% of
  # the time but had less than half the spread (std 0.054 vs 0.125), were
  # WORSE at the 5th percentile, and never set the record -- it is a variance
  # reducer, not an optimum finder. Record-keeping is the job that suits it.
  llm_mode: hybrid

# LLM / COPILOT INTEGRATION (dev/checks.txt item 4)
# Backs agent1.use_llm / agent2.use_llm / agent3.use_llm. Calls the Claude
# Code CLI (agents/claude_cli.py) -- the subscription you're already logged
# into (`claude auth status`), never a separately-billed ANTHROPIC_API_KEY.
# The CLI doesn't expose your subscription's true remaining usage %/reset
# date, so campaign_budget_usd is a self-tracked, locally-logged
# dollar-equivalent budget you set yourself (state/llm_usage.json), using
# the same cost units the CLI reports per call -- not a readout of your
# actual plan quota.
llm:
  # "cli" (Claude Code CLI) or "none" (fully disabled regardless of the
  # per-agent use_llm flags above).
  backend: cli

  # Model alias passed to `claude --model` for every call.
  model: sonnet

  # Total dollar-equivalent budget shared across every agent1/2/3 LLM call
  # this campaign. Once exhausted, every call site cleanly skips (falls
  # back to its existing non-LLM behavior) rather than erroring.
  campaign_budget_usd: 35.0

  # Per-call safety cap (also passed as `claude --max-budget-usd`) so one
  # call can never consume more than this even early in the campaign.
  # Only agent1_hyperparameter_review's calls typically got close to the
  # old 0.20 cap (avg $0.10, max $0.18 observed) -- the other two call
  # sites rarely approach it, so this mostly trims that one site's
  # expensive tail rather than constraining every call equally.
  max_call_budget_usd: 0.14

  # usage_log_path is intentionally NOT set here -- each agent defaults it
  # to <its own state_dir>/llm_usage.json (same convention as
  # noise_floor.json/search_planner_state.json: no config override, purely
  # constructor-derived), so tests that redirect state_dir stay isolated
  # from the real repo's state/llm_usage.json. Set it explicitly only if
  # you want every agent to share one non-default path.

# ORCHESTRATOR
orchestrator:
  # Multi-GPU parallel search (dev/checks.txt item 1): when true, each
  # iteration first tries to discover multiple live-free GPUs on the
  # configured remote server (see agents/remote_runner.py::discover_available_gpus)
  # and dispatch that many training runs concurrently. Falls back to the
  # existing single-run sequential path whenever remote isn't configured,
  # fewer than 2 GPUs are currently free, or this is false.
  parallel: true

  # Upper cap on concurrent GPUs/SSH sessions per wave, even if more are
  # discovered "available".
  #
  # ONE. The DGX allows each user one GPU at a time (HPC notice, 2026-08-11,
  # after two earlier emails). A four-GPU wave from this project was killed on
  # that date: of four dispatched runs exactly one survived, which is what
  # enforcement looks like from this side.
  #
  # This value is only the polite half. The binding limit is
  # remote_runner.MAX_CONCURRENT_GPUS, which caps discover_available_gpus
  # itself -- config alone would not constrain the scripts/ experiments, since
  # each of them dispatches its own waves without reading this file.
  max_parallel_runs: 1

  # Polling interval (seconds) - how often to check for work
  poll_interval_seconds: 5

  # Maximum iterations before stopping
  max_iterations: 100

# Model Training Configuration
# (Agent 1 will adjust these based on summary feedback; mirrors train.py's
# baseline defaults. Note: this block is illustrative — Agent 1 seeds its
# own defaults in code and writes the live values to model_hyperparams.yaml.)
model_params:
  n_layer: 8
  n_head: 4
  n_embd: 512
  embedding_lr: 0.6
  unembedding_lr: 0.004
  matrix_lr: 0.04
  scalar_lr: 0.5
  batch_size: 8192
  warmup_ratio: 0.0
  weight_decay: 0.2
