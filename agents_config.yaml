# Multi-Agent NN Parameter Optimization Configuration
# ===================================================

# AGENT 1: Training Specialist
agent1:
  # Whether to use Claude for hyperparameter suggestions (via the Claude
  # Code CLI -- your subscription, not a separately-billed API key, see the
  # llm: section below). Shares one campaign-wide budget with agent2/agent3.
  # Only actually calls Claude on the iteration right after Agent 3 creates
  # a fresh summary (agents/orchestrator.py tracks this) -- not every
  # iteration -- so it reads one complete, batch-informed summary per call
  # instead of firing on every single run.
  use_llm: true

  # Stop when accuracy reaches this threshold (val_bpb lower is better)
  accuracy_threshold: 0.97

  # Stop when total API cost exceeds this amount (USD)
  cost_limit_usd: 50.0

  # Training time budget per model (seconds)
  # SSH-timeout base ONLY -- it does NOT set training length. The budget is
  # prepare.py's TOKEN_BUDGET (12.5M tokens); train.py stops on tokens, not
  # seconds. Wall-clock therefore varies with throughput and server load:
  # median ~5 min, p90 ~10 min, ~19 min at the slowest throughput observed,
  # with a hard 1800s safety cap in train.py. This is set above that cap plus
  # eval/ablation overhead (~230s measured) so the SSH channel never gives up
  # on a run that is still legitimately working.
  training_budget_seconds: 2000

  # Safe operating ranges for each of train.py's 4 LR groups (see
  # GPT.setup_optimizer in train.py). Values are clamped to these ranges
  # before being written to model_hyperparams.yaml; train.py also clamps
  # independently as a defensive boundary check.
  embedding_lr_min: 0.05
  embedding_lr_max: 3.0
  unembedding_lr_min: 0.0005
  unembedding_lr_max: 0.02
  matrix_lr_min: 0.005
  matrix_lr_max: 0.2
  scalar_lr_min: 0.05
  scalar_lr_max: 2.0

  # Tier 1 surrogate (Random Forest + Expected Improvement, see
  # state/surrogate.py and agents/search_planner.py). Degrades automatically
  # to the evidence/heuristic path below when scipy/scikit-learn aren't
  # installed or there isn't enough data yet -- these keys don't need to be
  # touched for that fallback to work.
  use_surrogate: true
  surrogate_min_observations: 15   # Sobol cold-start size before the RF fits
  surrogate_cycle_runs: 10         # runs per block-rotation cycle
  # Two params are tuned jointly when their interaction score is at least
  # this fraction of the strongest observed interaction (union-find, see
  # state/surrogate.py::blocks_from_interactions).
  #
  # Measured on 552 real runs: interaction strength is 0.0706 for
  # n_layer x batch_size, 0.0534 for n_embd x batch_size, then drops ~2x to
  # 0.0265 for everything else. Both strong pairs tie model size to batch
  # size, which is exactly what a fixed wall-clock budget implies -- together
  # they set how many optimization steps a run gets (batch_size vs num_steps
  # is rho=-0.70, n_layer vs num_steps rho=-0.53).
  #
  # 0.15 sat below that long tail, so union-find chained 8 of the 11 params
  # into ONE block and EI ended up varying 8 dimensions at once -- sparse
  # coverage from 2000 candidates, and no real Gauss-Southwell benefit.
  # Anything in 0.4-0.7 yields the identical split ([n_layer, n_embd,
  # batch_size] + singletons), so this sits on a genuine structural boundary
  # rather than a knife-edge. Re-derive if the search space or the training
  # budget changes, since the size/batch coupling is budget-dependent.
  interaction_threshold: 0.4

  # Tier 2 token-level XAI (see agents/xai_methods/token_methods.py and
  # dev/INNOVATION_PLAN.md). Costs real extra GPU time (roughly doubled
  # wall-clock time in testing), so it isn't on for every run.
  #
  # token_xai_enabled is NOT set here -- Orchestrator decides it fresh each
  # iteration (agents/orchestrator.py) and writes it into that iteration's
  # hyperparams: on at a fixed interval (token_xai_interval, a floor so
  # history keeps accumulating during a losing streak) OR for the run right
  # after a new best val_bpb is found (the closest approximation to
  # "fingerprint the best model" possible today -- train.py fuses training
  # and fingerprinting into one process with no checkpoint save/reload, so
  # the actual best run can't be retroactively fingerprinted).
  token_xai_interval: 5

  # Score the held-out shard (prepare.py's HOLDOUT_SHARD, which the search
  # never trains or selects on) whenever a run sets a new best val_bpb.
  #
  # Why it matters: every accept/reject decision this campaign makes is
  # against ONE pinned validation shard, and it has now made 500+ of them --
  # a multiple-comparisons problem. With sigma=0.003187, the expected
  # inflation of "best of N" from noise alone is about sigma*sqrt(2*ln N)
  # ~= 0.011 bpb at N=564, against an elite-to-best gap of ~0.041. So a
  # meaningful slice of the apparent lead could be selection luck. The
  # holdout shard is the instrument that tells the difference, and until
  # this flag existed it was only reachable via a manual end-of-campaign
  # script (scripts/holdout_eval.py) -- so drift was never actually tracked.
  #
  # Cost is one extra eval pass, and only on a genuine new best (none in the
  # last 300+ runs), so it is effectively free. train.py makes the
  # comparison itself, in-process, because once a run ends its model is gone
  # and a record-setting config can never be re-scored afterwards.
  holdout_on_new_best: true

  # token_xai_seq_len/token_xai_n_batches ARE read by train.py directly from
  # model_hyperparams.yaml (same as ablation_k below), not from this file --
  # documented here for discoverability only.
  # token_xai_seq_len: 384      # tokens per probe slice (short, not the full training context -- VRAM discipline)
  # token_xai_n_batches: 4      # number of probe slices to average the fingerprint over

# AGENT 2: XAI Specialist
agent2:
  # Which XAI method to use: "fast" or "thorough"
  xai_method: "fast"

  # Whether to use Claude for prose report interpretation (via the Claude
  # Code CLI, see the llm: section below). Adds a short "LLM Interpretation"
  # section to every per-run report. OFF by default: this fires on EVERY
  # iteration (unlike agent3, which only fires every batch_size reports),
  # so it was the single fastest drain on the shared campaign_budget_usd.
  use_llm: false

  # Fast methods
  fast_methods:
    - ablation  # Turn off attention heads, measure impact
    - partial_dependence  # Vary hyperparams, estimate impact

  # For ablation: analyze top-K heads by weight magnitude
  ablation_k: 10

  # Only re-analyze what changed (incremental analysis)
  incremental: true

  # Auto-generate charts (hyperparameter importance, head heatmap, per-layer
  # scalars) and embed them in every report's markdown. See state/visualize.py.
  generate_charts: true

# AGENT 3: Report Analyst
agent3:
  # Summarize every N new reports (batch size). Larger batches mean fewer
  # summaries (and fewer agent3/agent1 LLM calls, since Agent 1 only reads
  # the LLM path on the iteration right after a fresh summary) at the cost
  # of less frequent hyperparameter-recommendation refreshes.
  batch_size: 7

  # Whether to use Claude for narrative summary + Tier 3 cluster hypotheses
  # (via the Claude Code CLI, see the llm: section below).
  use_llm: true

  # Include previous summary in new summary (preserve history)
  preserve_history: true

  # Auto-generate charts (val_bpb trend, importance evolution, status
  # distribution, layer importance) and embed them in every summary's
  # markdown. See state/visualize.py.
  generate_charts: true

  # Tier 3 (see state/clustering.py, dev/INNOVATION_PLAN.md): minimum number
  # of historical token-fingerprint-bearing reports before clustering runs
  # at all -- below this, the summary honestly reports "not enough data yet"
  # rather than fabricating a cluster. Silhouette-based cluster selection
  # needs enough points to be meaningful; 8 is a considered starting floor,
  # adjustable once real fingerprint history accumulates via Tier 2's
  # token_xai_interval cadence trigger (agents/orchestrator.py).
  min_cluster_observations: 8

# AGENT 4: OPTIMIZATION LANDSCAPE EXPLORER
#
# Every other search path in this system is local: agents/search_planner.py
# pins its EI center at the current best on every call and only varies the
# active Gauss-Southwell block around it, so nothing here can leave a basin
# once the campaign settles into one. Agent 4 is that missing capability.
# Periodically it checks whether the frontier is still moving; if it is, it
# returns control immediately having spent nothing. If it isn't, it takes a
# bounded budget of iterations to probe the least-explored region of the
# landscape and decides whether to relocate the whole search there.
agent4:
  enabled: true

  # How often (in iterations) Agent 4 checks whether the search looks
  # trapped. A check that finds a healthy frontier costs zero iterations.
  check_interval: 30

  # Maximum iterations one exploration window may consume. 9 = three probe
  # waves of 3, so the budget divides evenly into whole decision batches
  # with no orphan iteration left over.
  window_iterations: 9

  # Probes dispatched per batch. This is also the abandon rule -- a region
  # is condemned when every probe in one batch comes back bad -- so a probe
  # wave is exactly one decision boundary. Deliberately one setting rather
  # than two: the orchestrator caps multi-GPU wave size to this while a
  # window is open, so the abandon test stays exact under parallelism as
  # well as sequentially, which it could not if the two could diverge.
  probe_wave_size: 3

  # A probe counts as "bad" if its val_bpb exceeds the departed region's
  # elite reference (median of its top quartile) by more than this fraction.
  bad_tolerance: 0.05

  # --- the commit bar -----------------------------------------------------
  # Committing relocates the ENTIRE campaign's focus and is expensive to
  # undo, so all three of these must hold: enough runs, a top-quartile
  # median beating the departed region's by commit_margin, and the whole
  # sample's median beating it too. The third clause matters more than it
  # looks: top_quartile_by_val_bpb returns max(1, int(n * 0.25)) entries, so
  # at window-sized samples "top quartile" is literally the single best run
  # -- without a distributional check, one lucky draw could move the whole
  # search.
  #
  # commit_margin is CALIBRATED AGAINST THE MEASURED NOISE FLOOR, not picked
  # as a round number. sigma is 0.003187 (state/noise_floor.json) = 0.24% of
  # a typical val_bpb, so a percentage bar here is worth far more sigma than
  # it looks. An earlier 0.03 was ~11.6 sigma, putting the bar at 1.1962 --
  # below every one of 514 historical runs including the all-time best
  # (1.2065). Agent 4 would have explored at every check and been
  # mathematically unable to ever act on what it found.
  #
  # 0.006 is ~2.3 sigma (bar ~1.2258, cleared by ~2.3% of historical runs).
  # The lower bound on this number is set by min_runs_before_commit: at 6
  # runs, top_quartile_by_val_bpb returns max(1, int(6*0.25)) = exactly ONE
  # run, so this clause is a single-run comparison carrying a full +/-sigma
  # of measurement noise. Below ~2 sigma the campaign would be relocating on
  # noise. Raising min_runs_before_commit to 8+ would make the quartile 2+
  # runs and justify a smaller margin, at the cost of most of the window
  # budget going to one region.
  #
  # Deliberately relaxed from 3.9 sigma: the error actually being suffered is
  # the false NEGATIVE (the frontier has not moved in 303 runs), while a
  # false positive costs roughly one check_interval of detour. Note the
  # detour is not automatically clawed back -- a heavily-sampled region has
  # low surrogate uncertainty, and Agent 4 picks candidates by HIGH
  # uncertainty, so it will not naturally navigate back to an abandoned good
  # region. Independent protection comes from the second commit clause
  # (median of all probes vs the origin's median), which is a full-sample
  # test and is unaffected by this margin.
  commit_margin: 0.006
  min_runs_before_commit: 6

  # Runs in a region before leaving it can honestly be called a "local
  # optimum" rather than merely "exploitation paused". A short window does
  # not license the stronger claim.
  heavy_exploitation_n: 20

  # How wide a "region" is, as a fraction of the landscape's PCA grid extent
  # -- the same 2D space state/visualize.py draws, so a region means the
  # same thing to the code and on the chart. Measured against the real 514-run
  # history: 0.15 swept in 63% of the entire campaign as one "region", which
  # turns the new-vs-origin comparison into new-vs-everything and defeats the
  # point. 0.05 captures ~15% (77 runs) -- an actual neighborhood, still large
  # enough for a stable top-quartile reference.
  region_radius: 0.05

  # Frontier is "stagnant" when the best-so-far improved by less than
  # stagnation_min_improvement (relative, so the bar means the same thing at
  # val_bpb 1.8 as at 1.2) over the last stagnation_lookback runs.
  stagnation_lookback: 10
  stagnation_min_improvement: 0.005

  # statistics | hybrid | llm
  #   statistics -- fully deterministic, zero LLM cost.
  #   hybrid     -- decisions stay deterministic; the LLM only writes the
  #                 prose decision summary each window reads back for
  #                 context (~2-4 calls per 30 iterations).
  #   llm        -- the LLM additionally gets a veto on a commit. It can
  #                 only block one the statistics already approved, never
  #                 approve one on its own, and a failed/over-budget call
  #                 falls back to the deterministic verdict.
  llm_mode: hybrid

  # Resolution of the predicted-surface grid shared with the landscape chart.
  grid_resolution: 24

# LLM / COPILOT INTEGRATION (dev/checks.txt item 4)
# Backs agent1.use_llm / agent2.use_llm / agent3.use_llm. Calls the Claude
# Code CLI (agents/claude_cli.py) -- the subscription you're already logged
# into (`claude auth status`), never a separately-billed ANTHROPIC_API_KEY.
# The CLI doesn't expose your subscription's true remaining usage %/reset
# date, so campaign_budget_usd is a self-tracked, locally-logged
# dollar-equivalent budget you set yourself (state/llm_usage.json), using
# the same cost units the CLI reports per call -- not a readout of your
# actual plan quota.
llm:
  # "cli" (Claude Code CLI) or "none" (fully disabled regardless of the
  # per-agent use_llm flags above).
  backend: cli

  # Model alias passed to `claude --model` for every call.
  model: sonnet

  # Total dollar-equivalent budget shared across every agent1/2/3 LLM call
  # this campaign. Once exhausted, every call site cleanly skips (falls
  # back to its existing non-LLM behavior) rather than erroring.
  campaign_budget_usd: 35.0

  # Per-call safety cap (also passed as `claude --max-budget-usd`) so one
  # call can never consume more than this even early in the campaign.
  # Only agent1_hyperparameter_review's calls typically got close to the
  # old 0.20 cap (avg $0.10, max $0.18 observed) -- the other two call
  # sites rarely approach it, so this mostly trims that one site's
  # expensive tail rather than constraining every call equally.
  max_call_budget_usd: 0.14

  # usage_log_path is intentionally NOT set here -- each agent defaults it
  # to <its own state_dir>/llm_usage.json (same convention as
  # noise_floor.json/search_planner_state.json: no config override, purely
  # constructor-derived), so tests that redirect state_dir stay isolated
  # from the real repo's state/llm_usage.json. Set it explicitly only if
  # you want every agent to share one non-default path.

# ORCHESTRATOR
orchestrator:
  # Multi-GPU parallel search (dev/checks.txt item 1): when true, each
  # iteration first tries to discover multiple live-free GPUs on the
  # configured remote server (see agents/remote_runner.py::discover_available_gpus)
  # and dispatch that many training runs concurrently. Falls back to the
  # existing single-run sequential path whenever remote isn't configured,
  # fewer than 2 GPUs are currently free, or this is false.
  parallel: true

  # Upper cap on concurrent GPUs/SSH sessions per wave, even if more are
  # discovered "available" -- conservative default so an unattended run
  # doesn't try to claim an entire shared server other people also use.
  max_parallel_runs: 4

  # Polling interval (seconds) - how often to check for work
  poll_interval_seconds: 5

  # Maximum iterations before stopping
  max_iterations: 100

# Model Training Configuration
# (Agent 1 will adjust these based on summary feedback; mirrors train.py's
# baseline defaults. Note: this block is illustrative — Agent 1 seeds its
# own defaults in code and writes the live values to model_hyperparams.yaml.)
model_params:
  n_layer: 8
  n_head: 4
  n_embd: 512
  embedding_lr: 0.6
  unembedding_lr: 0.004
  matrix_lr: 0.04
  scalar_lr: 0.5
  batch_size: 8192
  warmup_ratio: 0.0
  weight_decay: 0.2
